[package]
name = "compile-logic"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lints]
workspace = true

[dependencies]
compile-algebra = { path = "../algebra" }
core-algebra = { path = "../../core/algebra" }
util = { path = "../../util" }
runtime-algebra = { path = "../../runtime/algebra", optional = true }

[features]
# The prover's witness derivation: what a production prover needs from the
# circuit crates to evaluate a witness, without the test-only evaluators.
witness = [
    "dep:runtime-algebra",
]
testonly = [
    "witness","dep:runtime-algebra", "runtime-algebra/testonly"
]
