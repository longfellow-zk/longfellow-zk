[package]
name = "longfellow-zk"
version = "0.1.0"
edition = "2021"
description = "Longfellow v1/v2 Zero-Knowledge proof system and ISO 18013-5 mdoc circuits"
license = "Apache-2.0"
repository = "https://github.com/google/longfellow-zk"
exclude = [
    "applications/mdoc_zk/artifacts/circuits/*",
    "applications/mdoc_zk/artifacts/proofs/*",
    "applications/mdoc_zk/prover_only/*",
    "applications/mdoc_zk/verifier_only/*",
    "*.vir",
    "*.rlib",
]

[features]
default = ["verifier", "prover", "compiler", "mdoc"]
verifier = []
prover = []
compiler = ["dep:bumpalo", "dep:num-bigint", "dep:num-traits", "dep:rustc-hash"]
mdoc = ["dep:zstd"]
testonly = ["verifier", "prover", "compiler"]
force-32bit-limbs = []
limb32 = ["force-32bit-limbs"]
force-generic-arch = []
# Benchmark-only allocation tracking; keep it off for timing measurements.
bench-memory = []
# Opt-in phase diagnostics for benchmarks; keep disabled for ordinary timing.
bench-profile = []
# Opt-in arithmetic and circuits under development; never enabled by default.
experimental = []
# Offline audits and specification generation; never a proof-role dependency.
tooling = ["compiler", "experimental", "dep:serde_json"]

[dependencies]
aes = "0.8.4"
bumpalo = { version = "3.16.0", optional = true }
getrandom = "0.3"
num-bigint = { version = "0.4", optional = true }
num-traits = { version = "0.2", optional = true }
rustc-hash = { version = "2.1.0", optional = true }
sha2 = { version = "0.10.8", features = ["asm"] }
zstd = { version = "0.13", optional = true }

serde_json = { version = "1.0", features = ["arbitrary_precision"], optional = true }

[dev-dependencies]
criterion = "0.5"
hex = "0.4.3"
num-bigint = "0.4"
num-traits = "0.2"
serde_json = "1.0"

[[bin]]
name = "prover_only"
path = "applications/mdoc_zk/prover_only/src/main.rs"
required-features = ["prover", "mdoc"]

[[bin]]
name = "verifier_only"
path = "applications/mdoc_zk/verifier_only/src/main.rs"
required-features = ["verifier", "mdoc"]

[[bin]]
name = "convert_circuits_v1"
path = "applications/mdoc_zk/runtime/src/bin/convert_circuits_v1.rs"
required-features = ["compiler", "mdoc"]

[[bench]]
name = "p256_benchmark"
path = "runtime/algebra/benches/p256_benchmark.rs"
harness = false

[[bench]]
name = "q256_benchmark"
path = "runtime/algebra/benches/q256_benchmark.rs"
harness = false

[[bench]]
name = "fft_benchmark"
path = "runtime/algebra/benches/fft_benchmark.rs"
harness = false

[[bench]]
name = "rfft_benchmark"
path = "runtime/algebra/benches/rfft_benchmark.rs"
harness = false

[[bench]]
name = "lch14_benchmark"
path = "runtime/algebra/benches/lch14_benchmark.rs"
harness = false

[[bench]]
name = "sumcheck_bench_v1"
path = "runtime/sumcheck-v1/benches/sumcheck_bench_v1.rs"
harness = false

[[bench]]
name = "sumcheck_bench_v2"
path = "runtime/sumcheck-v2/benches/sumcheck_bench_v2.rs"
harness = false
required-features = ["prover"]

[[bench]]
name = "mdoc_zk_bench_v1"
path = "applications/mdoc_zk/runtime/benches/mdoc_zk_bench_v1.rs"
harness = false
required-features = ["prover", "verifier", "compiler", "mdoc", "testonly"]

[[bench]]
name = "mdoc_zk_bench_next"
path = "applications/mdoc_zk/runtime/benches/mdoc_zk_bench_next.rs"
harness = false
required-features = ["prover", "verifier", "compiler", "mdoc", "testonly"]

[[bench]]
name = "fp24_benchmark"
path = "runtime/algebra/benches/fp24_benchmark.rs"
harness = false
required-features = ["experimental"]

[[bench]]
name = "mdoc_zk_bench_v9"
path = "applications/mdoc_zk/runtime/benches/mdoc_zk_bench_v9.rs"
harness = false
required-features = ["prover", "verifier", "compiler", "mdoc", "testonly", "experimental"]

[[bench]]
name = "mldsa_bench_v2"
path = "circuits/experimental/benches/mldsa_bench_v2.rs"
harness = false
required-features = ["experimental", "testonly"]

[[bench]]
name = "polygero_bench"
path = "runtime/polygero/benches/polygero_bench.rs"
harness = false
required-features = ["testonly"]

[[bench]]
name = "range_interpolation_benchmark"
path = "runtime/algebra/benches/range_interpolation_benchmark.rs"
harness = false

[lints.clippy]
shadow_same = "warn"
shadow_reuse = "warn"
shadow_unrelated = "warn"
type_complexity = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 2
lto = false

[[bin]]
name = "zk_tool"
path = "tools/zk_tool/main.rs"
required-features = ["tooling"]
