[package]
name = "longfellow-zk"
version = "0.1.0"
edition = "2021"
description = "Longfellow v1/v2 Zero-Knowledge proof system and ISO 18013-5 mdoc circuits"
license = "Apache-2.0"
repository = "https://github.com/google/longfellow-zk"
exclude = [
    "src/mdoc/artifacts/circuits/*",
    "src/mdoc/artifacts/proofs/*",
    "src/bin/prover_only.rs",
    "src/bin/verifier_only.rs",
    "*.vir",
    "*.rlib",
]

[features]
default = ["verifier", "prover", "compiler", "mdoc", "v1"]
# The deployed v1 protocol: its runtime, transcript (AES-256 challenges) and mdoc entry points.
v1 = ["dep:aes"]
verifier = []
# OS randomness for private coins is needed only to prove.
prover = ["dep:getrandom"]
compiler = ["dep:bumpalo", "dep:num-bigint", "dep:num-traits", "dep:rustc-hash"]
mdoc = ["dep:zstd"]
testonly = ["verifier", "prover", "compiler", "v1"]
force-32bit-limbs = []
limb32 = ["force-32bit-limbs"]
force-generic-arch = []
# Build-time selection for 32-bit ARM Linux. Also enable -C target-feature=+neon;
# cargo build-armv7-neon supplies both and requires a NEON-capable CPU.
# Stable Rust does not expose ARM NEON through cfg(target_feature).
arm-neon = []
# Benchmark-only allocation tracking; keep it off for timing measurements.
bench-memory = []
# Offline audits and specification generation; never a proof-role dependency.
tooling = ["compiler", "dep:serde_json", "dep:scip", "dep:protobuf"]

[dependencies]
aes = { version = "0.8.4", optional = true }
bumpalo = { version = "3.16.0", optional = true }
getrandom = { version = "0.3", optional = true }
num-bigint = { version = "0.4", optional = true }
num-traits = { version = "0.2", optional = true }
rustc-hash = { version = "2.1.0", optional = true }
# Keep "asm" forced: on aarch64 it is what enables sha2's hardware SHA-256
# backend (without it SHA-256 falls back to software), and on x86 it supplies
# the fallback for CPUs without SHA extensions. An opt-out feature would
# silently slow role-specific builds made with --no-default-features.
sha2 = { version = "0.10.8", features = ["asm"] }
zstd = { version = "0.13", default-features = false, optional = true }

serde_json = { version = "1.0", features = ["arbitrary_precision"], optional = true }
# Read rust-analyzer's SCIP index in the deps tool (tooling only).
scip = { version = "0.10", optional = true }
protobuf = { version = "3.7", optional = true }

[dev-dependencies]
bumpalo = "3.16.0"
criterion = "0.5"
hex = "0.4.3"
num-bigint = "0.4"
num-traits = "0.2"
rustc-hash = "2.1.0"
serde_json = "1.0"

[[bin]]
name = "prover_only"
path = "src/bin/prover_only.rs"
required-features = ["prover", "mdoc", "v1"]

[[bin]]
name = "verifier_only"
path = "src/bin/verifier_only.rs"
required-features = ["verifier", "mdoc", "v1"]

[[bench]]
name = "p256_benchmark"
path = "benches/p256_benchmark.rs"
harness = false

[[bench]]
name = "q256_benchmark"
path = "benches/q256_benchmark.rs"
harness = false

[[bench]]
name = "fft_benchmark"
path = "benches/fft_benchmark.rs"
harness = false

[[bench]]
name = "rfft_benchmark"
path = "benches/rfft_benchmark.rs"
harness = false

[[bench]]
name = "lch14_benchmark"
path = "benches/lch14_benchmark.rs"
harness = false

[[bench]]
name = "sumcheck_bench_v1"
path = "benches/sumcheck_bench_v1.rs"
harness = false
required-features = ["v1"]

[[bench]]
name = "circuit_id"
path = "benches/circuit_id.rs"
harness = false
required-features = ["compiler", "mdoc"]

[[bench]]
name = "sumcheck_bench_v2"
path = "benches/sumcheck_bench_v2.rs"
harness = false
required-features = ["prover"]

[[bench]]
name = "mdoc_zk_bench_v1"
path = "benches/mdoc_zk_bench_v1.rs"
harness = false
required-features = ["prover", "verifier", "compiler", "mdoc", "testonly"]

[[bench]]
name = "mdoc_zk_bench_next"
path = "benches/mdoc_zk_bench_next.rs"
harness = false
required-features = ["prover", "verifier", "compiler", "mdoc", "testonly"]

[[bench]]
name = "polygero_bench"
path = "benches/polygero_bench.rs"
harness = false
required-features = ["testonly"]

[[bench]]
name = "range_interpolation_benchmark"
path = "benches/range_interpolation_benchmark.rs"
harness = false

[lints.clippy]
shadow_same = "warn"
shadow_reuse = "warn"
shadow_unrelated = "warn"
type_complexity = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 2
lto = false

[[bin]]
name = "zk_tool"
path = "src/bin/zk_tool/main.rs"
required-features = ["tooling"]

[[bin]]
name = "dependency_check"
path = "src/bin/dependency_check/main.rs"
required-features = ["tooling"]
