
name = "formal_circuits"
version = "0.1.0"
defaultTargets = ["ECDSA", "pk_circuit", "JBAgreement", "Merkle", "Bcs", "Ligero.APITest", "LigeroLocalCounts", "SumcheckV1", "SumcheckV2.APITest", "polygero.APITest", "RustPolygeroProfiles", "RuntimeHahn.APITest", "polygero.Benchmarks.HahnRateSixteenth", "LfzkV1", "LfzkV1.FlatV7All", "LfzkV2.APITest"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
path = "../../mathlib4"
rev = "v4.31.0"


[[lean_lib]]
name = "ReedSolomon"
srcDir = "ligero"
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false, warningAsError = true }

[[lean_lib]]
name = "CodingTheory"
srcDir = "ligero"
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false, warningAsError = true }

[[lean_lib]]
name = "AffineAgreement"
srcDir = "ligero"
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false, warningAsError = true }

[[lean_lib]]
name = "SelectedMCA"
srcDir = "ligero"
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false, warningAsError = true }

[[lean_lib]]
name = "LigeroFamily"
srcDir = "ligero"
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false, warningAsError = true }

[[lean_lib]]
name = "Ligero"
srcDir = "ligero"
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false, warningAsError = true }

[[lean_lib]]
name = "JBAgreement"
srcDir = "ligero"
globs = ["JBAgreement", "JBAgreement.+"]
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false, warningAsError = true }

[[lean_lib]]
name = "examples"
srcDir = "ligero"
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false, warningAsError = true }

# The v7 Ligero local-count certificates are included in the default build.
[[lean_lib]]
name = "LigeroLocalCounts"
srcDir = "ligero"
roots = ["LigeroLocalCounts"]
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false, warningAsError = true }


[[lean_lib]]
name = "SumcheckV1"
srcDir = "sumcheck-v1"
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }

[[lean_lib]]
name = "SumcheckV2"
srcDir = "sumcheck-v2"
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false, warningAsError = true }


[[lean_lib]]
name = "Merkle"
srcDir = "merkle"


[[lean_lib]]
name = "Bcs"
srcDir = "bcs"
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false, warningAsError = true }



# --- lfzk-v1 -------------------------------------------------------------------
# Longfellow NIZK knowledge soundness: the round-by-round LayerStep, Fiat–Shamir as
# deployed, Ligero V1 budgets built from the ligero/ analysis, the two-field MAC step.
# Ported from the `proofs` repository's original Longfellow library, which builds with Lean's default
# implicit options; the package-level `autoImplicit = false` is therefore overridden
# for this lib only.

[[lean_lib]]
name = "LfzkV1"
srcDir = "lfzk-v1"
leanOptions = { autoImplicit = true, relaxedAutoImplicit = true }

[[lean_lib]]
name = "LfzkV2"
srcDir = "lfzk-v2"
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false, warningAsError = true }

[[lean_lib]]
name = "ECDSA"
srcDir = "circuits"
globs = ["ECDSA.+"]

[[lean_lib]]
name = "pk_circuit"
srcDir = "circuits/tests/ec"
roots = ["PkCircuit", "PkCircuitPoly", "ProjectiveOrder"]

[[lean_lib]]
name = "RecursivePolygero"
srcDir = "."
roots = ["polygero"]
globs = ["polygero", "polygero.+"]
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false, warningAsError = true }

# Exact parameter certificates, checked independently of the Rust prover and
# verifier. The runtime profiles, v7 Ligero counts and benchmark table are default targets.
[[lean_lib]]
name = "RuntimeHahn"
srcDir = "parameters/hahn"
globs = ["RuntimeHahn.+"]
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false, warningAsError = true }

[[lean_lib]]
name = "RustPolygeroProfiles"
srcDir = "parameters/polygero"
roots = ["PolygeroRustHahn", "TunedProfiles"]
globs = ["PolygeroRustHahn", "TunedProfiles"]
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false, warningAsError = true }
