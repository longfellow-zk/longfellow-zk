name: Production Rust CI

on:
  push:
    branches:
      - main
      - rust
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            rust:
              - 'rust/**'
              - '.github/workflows/production_ci.yml'

  build-and-test:
    name: Build & Run All Tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ensure Rust toolchain is up to date
        run: rustup update stable

      - name: Compilation Check
        run: cargo check --all-targets
        working-directory: rust

      - name: Run clippy
        run: cargo clippy --all-targets
        working-directory: rust

      - name: Run All Workspace Tests in Release Mode
        run: cargo test -r --workspace --all-targets
        working-directory: rust
