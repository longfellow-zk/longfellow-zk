name: Production Rust CI

on:
  push:
    branches:
      - main
      - rust
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            rust:
              - 'rust/**'
              - '.github/workflows/production_ci.yml'
              # Programs outside rust/ that the checks build against the crate.
              - 'formal/lfzk-v1/scripts/**'
              - 'formal/scripts/*.rs'
              - 'formal/scripts/Cargo.*'
              - 'formal/lfzk-v2/LfzkV2/Current/MdocRoundShape.lean'

  build-and-test:
    name: Pre-commit checks
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The clippy counts are compared with the parent commit.
          fetch-depth: 2

      - name: Install Rust toolchains
        # Nightly rustfmt formats the crate; rust-analyzer indexes it for the
        # dependency check.
        run: |
          rustup update stable
          rustup component add clippy rust-analyzer
          rustup toolchain install nightly --profile minimal --component rustfmt

      - name: Pre-commit checks
        # The AGENTS.md checklist (rust/tools/src/bin/precommit): formatting, every
        # role and feature build warning-free, the dependency check, the
        # standalone role dependency trees, clippy against the parent commit,
        # the release tests, and the formal inspectors and round shapes. The
        # nightly doctests have their own job. The cross builds are skipped:
        # they need cross C toolchains that this runner does not have. The
        # experimental Rust mdoc shapes differ from the upstream Lean shapes;
        # formal/ remains the upstream v2 tree on this branch.
        run: >-
          cargo run --release -p longfellow-zk-tools --bin precommit --
          --keep-going --fmt-check --base HEAD^ --no-cross --skip doctests,round-shapes
        working-directory: rust

      - name: Experimental ML-DSA and SIMD checks
        run: |
          cargo check --all-targets --features testonly,mldsa
          for features in prover,mldsa verifier,mldsa compiler,mldsa; do
            cargo check --lib --bins --no-default-features --features "$features"
          done
          cargo clippy --all-targets --features testonly,mldsa
          cargo test --release --lib --tests --features testonly,mldsa
        working-directory: rust

  doctests:
    name: Nightly doctests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchains
        run: |
          rustup update stable
          rustup toolchain install nightly --profile minimal

      - name: Doctests on nightly
        # Nightly also checks the error codes of the compile_fail doctests.
        run: cargo run -p longfellow-zk-tools --bin precommit -- --only doctests
        working-directory: rust

      - name: Experimental ML-DSA doctests
        run: cargo +nightly test --release --doc --features testonly,mldsa
        working-directory: rust
